<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timer de 5 minutos · Club de Monetización</title>
<meta name="description" content="Pausa de 5 minutos entre las partes de la clase, con recordatorios del Club.">
<meta name="theme-color" content="#05091a">
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* La identidad del Club: azul noche, los cuatro dorados y el azul eléctrico.
     El dorado lleva texto oscuro (#1a1200): con blanco no se lee. */
  :root {
    --noche: #05091a;
    --noche-2: #0a1230;
    --oro-claro: #ffd97d;
    --oro: #e8c060;
    --oro-medio: #c9a040;
    --oro-oscuro: #9b7520;
    --azul: #2468ff;
    --texto-oro: #1a1200;
    --tinta: #f4f6ff;
    --tinta-2: rgba(232, 236, 255, .72);
    --tinta-3: rgba(232, 236, 255, .48);
    --borde: rgba(255, 217, 125, .16);
    --titulos: 'Space Grotesk', 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--noche);
    color: var(--tinta);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }

  /* ── Fondo: las dos auroras del Club ── */
  .fondo { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  .fondo::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(1200px 700px at 50% 120%, rgba(36,104,255,.16), transparent 70%),
      linear-gradient(180deg, var(--noche) 0%, var(--noche-2) 100%);
  }
  .aurora { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; }
  .aurora.a { width: 62vmax; height: 62vmax; left: -18vmax; top: -24vmax;
    background: radial-gradient(circle, rgba(36,104,255,.55), transparent 65%); animation: flota-a 22s ease-in-out infinite alternate; }
  .aurora.b { width: 54vmax; height: 54vmax; right: -16vmax; bottom: -22vmax;
    background: radial-gradient(circle, rgba(201,160,64,.42), transparent 65%); animation: flota-b 26s ease-in-out infinite alternate; }
  @keyframes flota-a { to { transform: translate(10vmax, 8vmax) scale(1.12); } }
  @keyframes flota-b { to { transform: translate(-9vmax, -7vmax) scale(1.1); } }
  .rejilla {
    position: absolute; inset: 0; opacity: .5;
    background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px);
    background-size: 34px 34px;
    mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
  }

  /* ── Estructura ── */
  .pagina {
    position: relative; z-index: 1; height: 100%;
    display: grid; grid-template-rows: auto 1fr;
    padding: clamp(16px, 2.6vw, 40px) clamp(16px, 4vw, 72px);
  }
  .barra { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .marca { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
  .marca img { width: clamp(34px, 3.2vw, 48px); height: auto; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255,217,125,.55), 0 8px 24px rgba(0,0,0,.4); }
  .marca span { font-family: var(--titulos); font-weight: 600; letter-spacing: .22em; text-transform: uppercase; font-size: clamp(.68rem, .9vw, .82rem); color: var(--oro-claro); }
  .acciones { display: flex; gap: 8px; transition: opacity .5s; }
  .icono {
    display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 100px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); color: var(--tinta-2);
    font-size: .82rem; text-decoration: none; transition: color .2s, border-color .2s, background .2s;
  }
  .icono:hover { color: #fff; border-color: rgba(255,217,125,.5); background: rgba(255,217,125,.08); }
  .icono svg { width: 17px; height: 17px; }
  .icono.solo { width: 40px; padding: 0; justify-content: center; }

  .escena {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
    align-items: center; gap: clamp(24px, 5vw, 96px);
    max-width: 1640px; width: 100%; margin: 0 auto; min-height: 0;
  }

  /* ── El reloj ── */
  .reloj { display: flex; flex-direction: column; align-items: center; gap: clamp(18px, 3vh, 34px); }
  .anillo { position: relative; width: min(58vh, 40vw); aspect-ratio: 1; }
  .anillo svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
  .pista { fill: none; stroke: rgba(255,255,255,.07); stroke-width: 7; }
  .arco {
    fill: none; stroke: url(#oro); stroke-width: 7; stroke-linecap: round;
    filter: drop-shadow(0 0 10px rgba(255,217,125,.45));
  }
  .halo {
    position: absolute; inset: 9%; border-radius: 50%;
    background: radial-gradient(circle at 50% 35%, rgba(255,217,125,.10), rgba(10,18,48,.55) 60%, rgba(5,9,26,.8));
    border: 1px solid var(--borde);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 30px 80px rgba(0,0,0,.45);
  }
  .lectura { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .tiempo {
    font-family: var(--titulos); font-weight: 700; line-height: 1; letter-spacing: -.02em;
    font-size: calc(min(58vh, 40vw) * .27); font-variant-numeric: tabular-nums;
    color: #fff; transition: color .4s;
  }
  .estado { margin-top: .9em; font-size: clamp(.72rem, 1.05vw, .95rem); letter-spacing: .24em; text-transform: uppercase; color: var(--tinta-3); }

  .mandos { display: flex; align-items: center; gap: 18px; transition: opacity .5s; }
  .play {
    width: clamp(68px, 6.4vw, 92px); aspect-ratio: 1; border-radius: 50%;
    display: grid; place-items: center; color: var(--texto-oro);
    background: linear-gradient(145deg, var(--oro-claro), var(--oro) 45%, var(--oro-medio));
    box-shadow: 0 0 0 6px rgba(255,217,125,.12), 0 14px 40px rgba(201,160,64,.45);
    transition: transform .2s, box-shadow .2s;
  }
  .play:hover { transform: scale(1.06); box-shadow: 0 0 0 9px rgba(255,217,125,.16), 0 18px 48px rgba(201,160,64,.55); }
  .play svg { width: 40%; height: 40%; }
  .play .i-pausa { display: none; }
  body.corriendo .play .i-play { display: none; }
  body.corriendo .play .i-pausa { display: block; }
  .secundario {
    width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); color: var(--tinta-2);
    transition: color .2s, border-color .2s;
  }
  .secundario:hover { color: #fff; border-color: rgba(255,217,125,.5); }
  .secundario svg { width: 20px; height: 20px; }
  .pista-teclas { font-size: .78rem; color: var(--tinta-3); transition: opacity .5s; }
  .pista-teclas kbd { font-family: inherit; font-size: .72rem; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); color: var(--tinta-2); }

  /* ── El texto y las recomendaciones ── */
  .lado { display: flex; flex-direction: column; min-width: 0; }
  .rotulo {
    align-self: flex-start; display: inline-flex; align-items: center; gap: 10px;
    padding: 8px 16px 8px 12px; border-radius: 100px;
    background: rgba(255,217,125,.08); border: 1px solid rgba(255,217,125,.3);
    color: var(--oro-claro); font-size: clamp(.72rem, 1vw, .9rem); font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
  }
  .rotulo i { width: 9px; height: 9px; border-radius: 50%; background: var(--oro-claro); box-shadow: 0 0 0 0 rgba(255,217,125,.6); }
  body.corriendo .rotulo i { animation: late 1.6s ease-out infinite; }
  @keyframes late { 0% { box-shadow: 0 0 0 0 rgba(255,217,125,.6); } 100% { box-shadow: 0 0 0 12px rgba(255,217,125,0); } }
  .titulo {
    margin-top: clamp(14px, 2.2vh, 26px);
    font-family: var(--titulos); font-weight: 700; line-height: .98; letter-spacing: -.025em;
    font-size: clamp(2.4rem, 5.6vw, 6rem);
  }
  .titulo em {
    font-style: normal;
    background: linear-gradient(100deg, var(--oro-claro), var(--oro) 40%, var(--oro-medio) 75%, var(--oro-claro));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .subtitulo { margin-top: clamp(10px, 1.6vh, 18px); font-size: clamp(1rem, 1.5vw, 1.4rem); color: var(--tinta-2); }

  .cinta {
    --paso: clamp(118px, 15vh, 156px);
    position: relative; margin-top: clamp(22px, 4vh, 48px);
    height: calc(var(--paso) * 2.6);
    mask-image: linear-gradient(180deg, transparent, #000 22%, #000 78%, transparent);
    -webkit-mask-image: linear-gradient(180deg, transparent, #000 22%, #000 78%, transparent);
  }
  .consejo {
    --d: 0; --s: .92;
    position: absolute; left: 0; right: 0; top: 50%;
    height: calc(var(--paso) - 16px);
    transform: translateY(calc(-50% + var(--d) * var(--paso))) scale(var(--s));
    opacity: 0;
    transition: transform .9s cubic-bezier(.65, 0, .25, 1), opacity .9s cubic-bezier(.65, 0, .25, 1), border-color .9s, background .9s;
    display: grid; grid-template-columns: auto 1fr; align-items: center; gap: clamp(14px, 1.6vw, 24px);
    padding: 0 clamp(16px, 2vw, 28px); border-radius: 22px;
    background: linear-gradient(160deg, rgba(20,30,70,.55), rgba(8,14,38,.6));
    border: 1px solid rgba(255,255,255,.08);
  }
  .consejo.vecino { opacity: .32; }
  .consejo.on {
    --s: 1; opacity: 1;
    background: linear-gradient(160deg, rgba(36,56,130,.55), rgba(10,18,48,.75));
    border-color: rgba(255,217,125,.42);
    box-shadow: 0 20px 50px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .consejo .ico {
    width: clamp(48px, 4.4vw, 64px); aspect-ratio: 1; border-radius: 16px; display: grid; place-items: center;
    background: rgba(255,217,125,.1); border: 1px solid rgba(255,217,125,.28); color: var(--oro-claro);
  }
  .consejo.on .ico { background: linear-gradient(145deg, var(--oro-claro), var(--oro-medio)); color: var(--texto-oro); border-color: transparent; }
  .consejo .ico svg { width: 46%; height: 46%; }
  .consejo small { display: block; font-size: clamp(.66rem, .82vw, .78rem); letter-spacing: .2em; text-transform: uppercase; color: var(--oro); font-weight: 600; }
  .consejo b { display: block; margin-top: 4px; font-family: var(--titulos); font-weight: 600; font-size: clamp(1.15rem, 1.9vw, 1.8rem); line-height: 1.12; }
  .consejo p { margin-top: 5px; font-size: clamp(.86rem, 1.1vw, 1.05rem); line-height: 1.4; color: var(--tinta-2); }
  .ruta { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 7px; }
  .ruta span { padding: 3px 10px; border-radius: 100px; font-size: clamp(.74rem, .92vw, .9rem); font-weight: 600; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); color: #fff; }
  .ruta span:last-child { background: rgba(255,217,125,.14); border-color: rgba(255,217,125,.4); color: var(--oro-claro); }
  .ruta i { font-style: normal; color: var(--tinta-3); }

  .puntos { display: flex; gap: 8px; margin-top: clamp(10px, 1.6vh, 18px); }
  .puntos i { width: 8px; height: 8px; border-radius: 100px; background: rgba(255,255,255,.16); transition: width .5s, background .5s; }
  .puntos i.on { width: 28px; background: var(--oro); }

  /* ── Barra de progreso ── */
  .progreso { position: fixed; left: 0; right: 0; bottom: 0; height: 4px; z-index: 2; background: rgba(255,255,255,.04); }
  .progreso b { display: block; height: 100%; transform-origin: left; transform: scaleX(0);
    background: linear-gradient(90deg, var(--oro-oscuro), var(--oro-claro)); box-shadow: 0 0 12px rgba(255,217,125,.6); }

  /* ── Estados ── */
  body.final .tiempo { color: var(--oro-claro); }
  body.final .anillo { animation: latido 1s ease-in-out infinite; }
  @keyframes latido { 50% { transform: scale(1.025); } }
  body.fin .tiempo { font-size: calc(min(58vh, 40vw) * .14); color: var(--oro-claro); }
  body.fin .anillo { animation: latido 1.6s ease-in-out infinite; }
  body.fin .halo { box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 0 80px rgba(255,217,125,.25), 0 30px 80px rgba(0,0,0,.45); }
  body.quieto { cursor: none; }
  body.quieto .mandos, body.quieto .acciones, body.quieto .pista-teclas { opacity: 0; pointer-events: none; }

  /* ── Pantallas angostas o verticales ── */
  @media (max-width: 900px), (max-aspect-ratio: 1/1) {
    body { overflow: auto; }
    .pagina { height: auto; min-height: 100%; }
    .escena { grid-template-columns: 1fr; gap: 28px; padding: 24px 0 40px; }
    .lado { align-items: center; text-align: center; }
    .rotulo { align-self: center; }
    .anillo { width: min(70vw, 40vh); }
    .tiempo { font-size: calc(min(70vw, 40vh) * .27); }
    body.fin .tiempo { font-size: calc(min(70vw, 40vh) * .14); }
    .cinta { width: 100%; text-align: left; }
    .icono .txt { display: none; }
    .icono { width: 40px; padding: 0; justify-content: center; }
  }
  @media (hover: none) { .pista-teclas { display: none; } }
  @media (prefers-reduced-motion: reduce) {
    .aurora, body.final .anillo, body.fin .anillo, body.corriendo .rotulo i { animation: none; }
    .consejo { transition-duration: .01s; }
  }
</style>
</head>
<body>
<div class="fondo" aria-hidden="true"><span class="aurora a"></span><span class="aurora b"></span><span class="rejilla"></span></div>

<div class="pagina">
  <header class="barra">
    <a class="marca" href="/" title="Volver a las presentaciones">
      <img src="/logo.png" alt="Club de Monetización">
      <span>Club de Monetización</span>
    </a>
    <div class="acciones">
      <a class="icono" href="/" title="Volver a las presentaciones">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        <span class="txt">Presentaciones</span>
      </a>
      <button class="icono solo" id="bSonido" title="Sonido al terminar (M)" aria-pressed="true"></button>
      <button class="icono solo" id="bCompleta" title="Pantalla completa (F)" aria-label="Pantalla completa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
    </div>
  </header>

  <main class="escena">
    <section class="reloj">
      <div class="anillo">
        <div class="halo"></div>
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffd97d"/><stop offset=".5" stop-color="#e8c060"/><stop offset="1" stop-color="#9b7520"/>
            </linearGradient>
          </defs>
          <circle class="pista" cx="100" cy="100" r="94"/>
          <circle class="arco" id="arco" cx="100" cy="100" r="94"/>
        </svg>
        <div class="lectura" role="timer" aria-live="off">
          <div class="tiempo" id="tiempo">5:00</div>
          <div class="estado" id="estado">Pulsa play</div>
        </div>
      </div>
      <div class="mandos">
        <button class="secundario" id="bReiniciar" title="Reiniciar (R)" aria-label="Reiniciar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button class="play" id="bPlay" title="Empezar / pausar (espacio)" aria-label="Empezar">
          <svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l10.8-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14z"/></svg>
          <svg class="i-pausa" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1.2"/><rect x="14" y="4.5" width="4" height="15" rx="1.2"/></svg>
        </button>
        <button class="secundario" id="bCompleta2" title="Pantalla completa (F)" aria-label="Pantalla completa">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        </button>
      </div>
      <p class="pista-teclas"><kbd>Espacio</kbd> play / pausa · <kbd>R</kbd> reiniciar · <kbd>F</kbd> pantalla completa</p>
    </section>

    <section class="lado">
      <span class="rotulo" id="rotulo"><i></i><span>Interludio · 5 minutos</span></span>
      <h1 class="titulo" id="titulo">Una pequeña <em>pausa</em></h1>
      <p class="subtitulo" id="subtitulo">Volvemos en cuanto termine el tiempo.</p>
      <div class="cinta" id="cinta" aria-live="polite"></div>
      <div class="puntos" id="puntos" aria-hidden="true"></div>
    </section>
  </main>
</div>

<div class="progreso" aria-hidden="true"><b id="barra"></b></div>

<script>
(function () {
  var TOTAL = 5 * 60 * 1000;        // cinco minutos
  var CADA_CONSEJO = 7000;          // cada cuánto pasa a la siguiente recomendación

  var ICONOS = {
    notas: '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
    agua: '<path d="M15.2 22H8.8a2 2 0 0 1-2-1.79L5 3h14l-1.81 17.21A2 2 0 0 1 15.2 22Z"/><path d="M6 12a5 5 0 0 1 6 0 5 5 0 0 0 6 0"/>',
    grabadas: '<circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4Z"/>',
    regalo: '<path d="M20 12v10H4V12"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7Z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7Z"/>',
    vista: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>'
  };

  var CONSEJOS = [
    { ico: 'notas', rotulo: 'Toma notas', titulo: 'Apunta lo más importante',
      texto: 'Repasa lo que llevamos y anota tus dudas para la segunda parte.' },
    { ico: 'agua', rotulo: 'Hidrátate', titulo: 'Aprovecha para tomar agua',
      texto: 'Levántate, estírate un poco y regresa con energía.' },
    { ico: 'grabadas', rotulo: 'Las clases quedan grabadas', titulo: 'Repítela cuando quieras',
      ruta: ['Skool', 'Cursos', 'Clases grabadas y repeticiones'] },
    { ico: 'regalo', rotulo: 'No lo olvides', titulo: 'Activa tu cuenta',
      texto: 'Actívala y recibe tu regalo del Club.' },
    { ico: 'vista', rotulo: 'Descansa la vista', titulo: 'Despega los ojos de la pantalla',
      texto: 'Mira a lo lejos unos segundos: tus ojos también necesitan su pausa.' }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var body = document.body, tiempo = $('tiempo'), estado = $('estado'), arco = $('arco'), barra = $('barra');
  var cinta = $('cinta'), puntos = $('puntos'), bPlay = $('bPlay');
  var CIRC = 2 * Math.PI * 94;
  arco.style.strokeDasharray = CIRC;

  // ── Recomendaciones que pasan solas ──
  var N = CONSEJOS.length, k = 0, tarjetas = [], anterior = [];
  cinta.innerHTML = CONSEJOS.map(function (c) {
    var detalle = c.ruta
      ? '<div class="ruta">' + c.ruta.map(function (r) { return '<span>' + r + '</span>'; }).join('<i>›</i>') + '</div>'
      : '<p>' + c.texto + '</p>';
    return '<article class="consejo"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      ICONOS[c.ico] + '</svg></span><div><small>' + c.rotulo + '</small><b>' + c.titulo + '</b>' + detalle + '</div></article>';
  }).join('');
  puntos.innerHTML = CONSEJOS.map(function () { return '<i></i>'; }).join('');
  tarjetas = [].slice.call(cinta.children);

  function pintarConsejos() {
    tarjetas.forEach(function (t, i) {
      var d = ((i - k) % N + N) % N;
      if (d > N / 2) d -= N;
      // La que da la vuelta (de arriba a abajo) salta sin animarse.
      if (anterior[i] !== undefined && Math.abs(d - anterior[i]) > 1) {
        t.style.transition = 'none';
        requestAnimationFrame(function () { requestAnimationFrame(function () { t.style.transition = ''; }); });
      }
      anterior[i] = d;
      t.style.setProperty('--d', d);
      t.classList.toggle('on', d === 0);
      t.classList.toggle('vecino', Math.abs(d) === 1);
      t.setAttribute('aria-hidden', d === 0 ? 'false' : 'true');
    });
    [].forEach.call(puntos.children, function (p, i) { p.classList.toggle('on', i === k); });
  }
  var rueda = 0;
  function girar(si) {
    clearInterval(rueda);
    if (si) rueda = setInterval(function () { k = (k + 1) % N; pintarConsejos(); }, CADA_CONSEJO);
  }
  pintarConsejos();

  // ── El temporizador ──
  // estado: 'listo' | 'corre' | 'pausa' | 'fin'. Se cuenta contra la hora de fin,
  // no sumando segundos: así no se atrasa aunque la pestaña quede en segundo plano.
  var modo = 'listo', resta = TOTAL, finEn = 0, cuadro = 0, alarma = 0, ultimo = '';

  function formato(ms) {
    var s = Math.ceil(ms / 1000);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  function quedan() { return modo === 'corre' ? Math.max(0, finEn - performance.now()) : resta; }

  function pintar() {
    var ms = quedan(), p = ms / TOTAL;
    var txt = modo === 'fin' ? '¡Volvemos!' : formato(ms);
    if (txt !== ultimo) { tiempo.textContent = txt; ultimo = txt; document.title = (modo === 'corre' ? txt + ' · ' : '') + 'Timer de 5 minutos · Club de Monetización'; }
    arco.style.strokeDashoffset = modo === 'fin' ? 0 : CIRC * (1 - p);
    barra.style.transform = 'scaleX(' + (1 - p) + ')';
    body.classList.toggle('final', modo === 'corre' && ms <= 10000);
  }
  function bucle() {
    pintar();
    if (modo === 'corre') {
      if (quedan() <= 0) return terminar();
      cuadro = requestAnimationFrame(bucle);
    }
  }

  function textos(rotulo, titulo, sub, est) {
    $('rotulo').lastChild.textContent = rotulo;
    $('titulo').innerHTML = titulo;
    $('subtitulo').textContent = sub;
    estado.textContent = est;
  }

  function empezar() {
    if (modo === 'fin') reiniciar();
    preparaSonido();
    modo = 'corre';
    finEn = performance.now() + resta;
    clearTimeout(alarma);
    alarma = setTimeout(terminar, resta + 50);
    body.classList.add('corriendo'); body.classList.remove('fin');
    bPlay.setAttribute('aria-label', 'Pausar');
    textos('Interludio · 5 minutos', 'Una pequeña <em>pausa</em>', 'Volvemos en cuanto termine el tiempo.', 'Minutos de pausa');
    girar(true);
    despierta(true);
    quieto();
    cancelAnimationFrame(cuadro); bucle();
  }
  function pausar() {
    resta = quedan();
    modo = 'pausa';
    clearTimeout(alarma); cancelAnimationFrame(cuadro);
    body.classList.remove('corriendo', 'quieto');
    bPlay.setAttribute('aria-label', 'Seguir');
    estado.textContent = 'En pausa';
    girar(false); despierta(false); pintar();
  }
  function reiniciar() {
    modo = 'listo'; resta = TOTAL;
    clearTimeout(alarma); cancelAnimationFrame(cuadro);
    body.classList.remove('corriendo', 'fin', 'final', 'quieto');
    bPlay.setAttribute('aria-label', 'Empezar');
    textos('Interludio · 5 minutos', 'Una pequeña <em>pausa</em>', 'Volvemos en cuanto termine el tiempo.', 'Pulsa play');
    k = 0; pintarConsejos(); girar(false); despierta(false); pintar();
  }
  function terminar() {
    if (modo !== 'corre') return;
    modo = 'fin'; resta = 0;
    clearTimeout(alarma); cancelAnimationFrame(cuadro);
    body.classList.remove('corriendo', 'final', 'quieto'); body.classList.add('fin');
    bPlay.setAttribute('aria-label', 'Empezar otra vez');
    textos('Se acabó la pausa', 'Retomamos <em>la clase</em>', 'Gracias por volver a tiempo.', 'Tiempo cumplido');
    girar(false); despierta(false); pintar(); campana();
  }
  function alternar() { modo === 'corre' ? pausar() : empezar(); }

  // ── Pantalla completa ──
  function completa() {
    var d = document, el = d.documentElement;
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  }

  // ── Los mandos se esconden mientras corre y no se mueve el ratón ──
  var reposo = 0;
  function quieto() {
    body.classList.remove('quieto'); clearTimeout(reposo);
    if (modo === 'corre') reposo = setTimeout(function () { body.classList.add('quieto'); }, 2600);
  }
  ['mousemove', 'pointerdown', 'touchstart'].forEach(function (ev) { window.addEventListener(ev, quieto, { passive: true }); });

  // ── Que la pantalla no se apague mientras corre ──
  var candado = null;
  function despierta(si) {
    try {
      if (si && navigator.wakeLock && !candado) navigator.wakeLock.request('screen').then(function (c) { candado = c; c.addEventListener('release', function () { candado = null; }); }).catch(function () {});
      else if (!si && candado) { candado.release(); candado = null; }
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') { if (modo === 'corre') { despierta(true); bucle(); } }
  });

  // ── Una campanita suave al terminar ──
  var conSonido = true, audio = null;
  try { conSonido = localStorage.getItem('timer_sonido') !== 'no'; } catch (e) {}
  var ICO_SON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
  var ICO_MUDO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>';
  function pintarSonido() {
    var b = $('bSonido');
    b.innerHTML = conSonido ? ICO_SON : ICO_MUDO;
    b.setAttribute('aria-pressed', String(conSonido));
    b.setAttribute('aria-label', conSonido ? 'Silenciar la campana' : 'Activar la campana');
  }
  function preparaSonido() {
    try { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === 'suspended') audio.resume(); } catch (e) {}
  }
  function campana() {
    if (!conSonido || !audio) return;
    var t = audio.currentTime + .05;
    [659.25, 783.99, 1046.5].forEach(function (f, i) {
      var o = audio.createOscillator(), g = audio.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t + i * .28);
      g.gain.linearRampToValueAtTime(.22, t + i * .28 + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t + i * .28 + 1.6);
      o.connect(g); g.connect(audio.destination);
      o.start(t + i * .28); o.stop(t + i * .28 + 1.7);
    });
  }
  pintarSonido();

  // ── Botones y teclado ──
  bPlay.addEventListener('click', alternar);
  $('bReiniciar').addEventListener('click', reiniciar);
  $('bCompleta').addEventListener('click', completa);
  $('bCompleta2').addEventListener('click', completa);
  $('bSonido').addEventListener('click', function () {
    conSonido = !conSonido; pintarSonido();
    try { localStorage.setItem('timer_sonido', conSonido ? 'si' : 'no'); } catch (e) {}
  });
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.key.toLowerCase();
    if (t === ' ' || t === 'k' || t === 'enter') { if (t !== 'enter' || document.activeElement === document.body) { e.preventDefault(); alternar(); } }
    else if (t === 'r') reiniciar();
    else if (t === 'f') completa();
    else if (t === 'm') $('bSonido').click();
    quieto();
  });

  pintar();
})();
</script>
</body>
</html>
